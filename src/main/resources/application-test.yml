spring:
  datasource:
    url: jdbc:h2:mem:eft_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  liquibase:
    enabled: false

scheduler:
  fixed-delay-ms: 60000
  batch-size: 10

yandex:
  speller:
    url: https://speller.yandex.net/services/spellservice.json/checkTexts
    connect-timeout-ms: 5000
    read-timeout-ms: 10000

logging:
  level:
    root: warn
    ru.errorfreetext: info